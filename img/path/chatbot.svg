  <g font-size="15">
    <rect x="390" y="110" width="186" height="44" rx="14" fill="#e8eef3"/><text x="406" y="138" fill="#1a1c1b">Do you have oat milk?</text>
    <rect x="224" y="172" width="300" height="66" rx="14" fill="#f1efe9"/><text x="240" y="199" fill="#1a1c1b">Yes: 3 brands in stock, aisle 7.</text><text x="240" y="222" fill="#1a1c1b">Shall I add one to your basket?</text>
