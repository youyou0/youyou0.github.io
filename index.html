      o.lab.setAttribute('x',lx);o.lab.setAttribute('y',ly);o.lab.setAttribute('text-anchor',Math.cos(a)>.15?'start':(Math.cos(a)<-.15?'end':'middle'));
      o.lab.setAttribute('dominant-baseline',Math.sin(a)<-.5?'auto':(Math.sin(a)>.5?'hanging':'middle'));
      o.lab.setAttribute('opacity',(vis*ease((t-4.8)/.6)).toFixed(3));});
    var last=null,ld=9;g.dots.forEach(function(o){var da=((o.a0+rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);if(da<ld){ld=da;last=o;}});
    if(last!==g.curDot){g.curDot=last;
      g.cur.textContent=last.e.t+(last.e.wip?' (coming)':'');if(!mono)g.cur.setAttribute('fill',DOOR[last.e.p].col);}
    g.dots.forEach(function(o){o.c.setAttribute('r',o.e===hoverEntry||o.e===pinned?7:(o===last?6.5:(o.e.more?3:4.5)));});
    g.cur.setAttribute('opacity',door?0:ease(ld/.04).toFixed(3));
    if(mono)pill(g.cur,g.curBg,9,5);                               // measured every frame: the web fonts may land after the first one
    // the reading panel follows what the cursor rests on (a door, a dot), else the pinned dot, else the entry on the "now" mark
    var sel=hoverEntry||pinned,want=door?{door:DOOR[door]}:{e:sel||last.e};
    var key=want.door?'d:'+want.door.id:'e:'+want.e.t+(sel?'':':now');
    if(key!==shownKey){shownKey=key;if(want.door)panelDoor(want.door);else panelEntry(want.e,!sel);}
    if(t>4.8)tip.classList.add('on');
    g.doors.forEach(function(o){var on=door===o.d.id;o.ray.setAttribute('class',on?'rh':'r');o.ray.style.stroke=on?o.d.col:'';o.node.setAttribute('fill',mono?(on?'var(--paper)':'var(--ink)'):(on?o.d.col:'var(--paper)'));o.icon.setAttribute('stroke',mono?(on?'var(--ink)':'var(--paper)'):(on?'var(--paper)':o.d.col));o.node.setAttribute('stroke-width',on&&mono?3:1.6);});
    // until the visitor has opened or hovered a door: the doors pulse in turn every 12 s, and a hint shows
    if(door)learnt=true;
    g.doors.forEach(function(o,k){var p=((t-6-k*1.1)%12+12)%12/1.4,show=!learnt&&t>6&&p<1&&!door;
      o.pulse.setAttribute('r',o.nr+16*ease(Math.min(p,1)));o.pulse.setAttribute('opacity',show?(.7*(1-p)).toFixed(3):0);});
    g.hint.setAttribute('opacity',learnt?0:(.9*ease((t-5.4)/.8)).toFixed(3));
    requestAnimationFrame(tick);
  }
  var tip=document.getElementById('tip');
  // pictures from the decks, embedded at build time (img:name); entries without one get a drawn plate for now
  var IMG={ombres:'/img/ombres.jpg',streetscore:'/img/streetscore.jpg',tevru:'/img/tevru.jpg',relearned:'/img/re-learned.png',tsclassify:'/img/tsclassify.jpg',ww:'/img/ww.jpg',city:'/img/city.jpg',vru:'/img/vru.jpg',forssea:'/img/forssea.webp',tunnelc:'/img/tunnelc.jpg',violin:'/img/violin.jpg',sanda:'/img/sanda.jpg',labagarre:'/img/labagarre.jpg',};
  // where each picture comes from; the Commons photos are CC licensed and must be credited
  var CREDIT={streetscore:'Frame: Basile Morin, CC BY-SA 4.0',ww:'Image: Citilog',city:'Image: Citilog',vru:'Image: Citilog',tunnelc:'Image: Citilog',forssea:'Image: Forssea Robotics',violin:'Photo: Pavol Frešo, CC BY 2.0',sanda:'Photo: Richardkw, CC BY-SA 3.0',labagarre:'Image: La Bagarre'};
  function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
  // a plate drawn from the same geometry as the page: lattice, a rosette whose petal count and turn come from the title, the door's icon
  function plate(e,d,cls){var h=hash(e.t),n=[6,8,12][h%3],tw=h%40,cx=150,cy=85,r=34,s='';
    for(var j=-1;j<4;j++)for(var i=-1;i<11;i++)s+='<circle cx="'+(i*34+(j%2?17:0))+'" cy="'+(j*29.4+12)+'" r="34" fill="none" stroke="'+d.col+'" stroke-opacity=".09"/>';
    for(var k=0;k<n;k++){var a=(k/n*360+tw)*Math.PI/180;s+='<circle cx="'+(cx+r*Math.cos(a)).toFixed(1)+'" cy="'+(cy+r*Math.sin(a)).toFixed(1)+'" r="'+r+'" fill="none" stroke="'+d.col+'" stroke-opacity=".55"/>';}
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(2*r)+'" fill="none" stroke="'+d.col+'" stroke-opacity=".35"/><circle cx="'+cx+'" cy="'+cy+'" r="21" fill="var(--paper)" stroke="'+d.col+'" stroke-width="1.5"/>';
    s+='<path d="'+d.ic+'" transform="translate(138,73)" fill="none" stroke="'+d.col+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
    return '<svg class="'+(cls||'ph')+'" viewBox="0 0 300 170" preserveAspectRatio="xMidYMid slice"><rect width="300" height="170" fill="'+d.col+'" fill-opacity=".06"/>'+s+'</svg>';}
  function pic(e,d,cls){return e.im?'<img class="'+(cls||'ph')+'" alt="" src="'+IMG[e.im]+'">':plate(e,d,cls);}
  function fmt(s){if(!s)return '';var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return s.length>=7?m[+s.slice(5,7)-1]+' '+s.slice(0,4):s;}
  var shownKey=null,hoverEntry=null,pinned=null,pinDoor=null,panelItem=null;
  var spd=1,lastAct=0,overTip=false,touch=matchMedia('(hover: none)').matches;
  svg.addEventListener('click',function(){pinned=pinDoor=null;});
  addEventListener('keydown',function(ev){lastAct=performance.now();if(ev.key==='Escape')pinned=pinDoor=null;});
  ['pointermove','pointerdown','wheel'].forEach(function(t){addEventListener(t,function(){lastAct=performance.now();},{passive:true});});
  tip.addEventListener('mouseenter',function(){overTip=true;});tip.addEventListener('mouseleave',function(){overTip=false;});
  function panelEntry(e,now){var d=DOOR[e.p],q=g.groups.filter(function(x){return x.d.id===d.id;})[0];panelItem={e:e};tip.style.setProperty('--c',d.col);
    tip.innerHTML=pic(e,d)+(e.im&&CREDIT[e.im]?'<div class="cr">'+CREDIT[e.im]+'</div>':'')+'<div class="bd"><div class="k">'+d.name+(now?'  ·  passing now':'')+'</div><div class="t">'+e.t+'</div><div class="m"><span>'+(e.wip?'coming soon':fmt(e.d))+'</span><span class="go">'+(e.wip||e.more?'':'Open')+'</span></div>'+
      (q&&q.shown.length>1?'<ul class="ls">'+q.shown.map(function(x){return '<li data-i="'+ENTRIES.indexOf(x)+'"'+(x===e?' class="on"':'')+'>'+x.t+(x.wip?' (coming)':'')+'</li>';}).join('')+'</ul>':'')+'</div>';}
  // a door shows as the cover of its page: a band in its colour with its icon and name, then everything the page holds
  function panelDoor(d){var mine=ENTRIES.filter(function(e){return e.p===d.id;}),MAXT=6;panelItem={d:d};
    tip.style.setProperty('--c',d.col);
    var tiles=mine.slice(0,MAXT).map(function(e){return '<div class="tl" data-i="'+ENTRIES.indexOf(e)+'">'+pic(e,d,'th')+'<span>'+e.t+(e.wip?' (coming)':'')+'</span></div>';}).join('');
    tip.innerHTML='<div class="hd"><svg viewBox="0 0 24 24"><path d="'+d.ic+'"/></svg><div><div class="k">Section</div><div class="t">'+d.name+'</div><div class="s">'+d.sub.charAt(0).toUpperCase()+d.sub.slice(1)+'</div></div></div>'+
      '<div class="mo">'+tiles+'</div><div class="bd"><div class="m"><span>'+mine.length+' '+(mine.length>1?'entries':'entry')+(mine.length>MAXT?', '+(mine.length-MAXT)+' more inside':'')+'</span><span class="go">Enter '+d.name+'</span></div></div>';}
  // a click on one of the entries listed in the panel opens that entry; anywhere else, what the panel shows
  tip.addEventListener('click',function(ev){var li=ev.target.closest('[data-i]');if(li)go(ENTRIES[+li.getAttribute('data-i')]);else if(panelItem)go(panelItem.d||panelItem.e);});
  // a door or an entry opens its page; one without a page yet says so
  // opening a section: the homepage's own flower stays, with the rings around its centre, and from its heart new
  // petals bloom - wave after wave, each a flower of six turned a little from the last so its petals open between
  // the others - growing out to the outer ring and no further, while the whole figure grows until that ring fills
  // the height of the screen; then the page fades in.
  // In ink, no colour. Straight to the page for visitors who asked for less motion.
  var bloomed=false;
  function go(x){
    if(!x.href){say((x.name||x.t)+': coming soon');return;}
    if(reduce||bloomed){location.href=x.href;return;}
    bloomed=true;
    // the bloom starts from what was clicked: the section's door (or the entry's dot) becomes the heart
    var el=null,mine=null;g.doors.forEach(function(o){if(o.d===x){el=o.node;mine=o.g;}});g.dots.forEach(function(o){if(o.e===x)el=o.c;});
    var b=(el||g.centre).getBoundingClientRect(),ox=b.left+b.width/2,oy=b.top+b.height/2,R0=+g.seed.getAttribute('r'),t0=performance.now();
    // its circle opens to the size of the outer ring and holds the new petals (a flower of radius R spans 2R);
    // meanwhile the section glides to the middle of the screen and grows until that circle fills its height
    var W=innerWidth,H=innerHeight,Rb=g.Re,Rmax=Rb/2,GROW=Math.max(1,0.96*Math.min(W,H)/2/Rb);
    var sb=svg.getBoundingClientRect();svg.style.transformOrigin=(ox-sb.left)+'px '+(oy-sb.top)+'px';
    svg.querySelectorAll('circle,line,path').forEach(function(n){n.setAttribute('vector-effect','non-scaling-stroke');});
    var st=getComputedStyle(document.documentElement),ink=st.getPropertyValue('--ink').trim()||'#1a1c1b';
    var rest=[g.ent,g.nowmark,g.hint].concat(g.doors.filter(function(o){return o.g!==mine;}).map(function(o){return o.g;})).concat(g.rays||[]);   // the rings, the lattice and the clicked door stay
    // the first flower, its point and the rings make way while the section glides to the centre; the section's
    // own name and line go at once, so only its circle is left to bloom
    var behind=[g.seed,g.centre,g.rings,g.lat].concat(g.six),words=mine?[].slice.call(mine.querySelectorAll('text')):[];
    var page=['.txt','.tip','.top'].map(function(q){return document.querySelector(q);});
    page.forEach(function(n){if(n)n.style.transition='none';});   // the panel's own fade would lag behind
    var cv=document.createElement('canvas'),dpr=Math.min(2,devicePixelRatio||1);
    cv.style.cssText='position:fixed;inset:0;z-index:60;pointer-events:none;width:'+W+'px;height:'+H+'px';cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
    var bx=cv.getContext('2d');bx.setTransform(dpr,0,0,dpr,0,0);
    var ez=function(x){x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;},eout=function(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3);};
    var WAVES=5;
    (function bloom(){var t=(performance.now()-t0)/1000,fade=ez(t/0.3),m=ez(t/1.05);
      rest.forEach(function(n){if(n)n.style.opacity=String(1-fade);});page.forEach(function(n){if(n)n.style.opacity=String(1-fade);});
      words.forEach(function(n){n.style.opacity=String(1-ez(t/0.2));});
      behind.forEach(function(n){if(n)n.style.opacity=String(1-ez((t-0.15)/0.6));});
      var S=1+(GROW-1)*m,tx=(W/2-ox)*m,ty=(H/2-oy)*m,hx=ox+tx,hy=oy+ty;
      svg.style.transform='translate('+tx+'px,'+ty+'px) scale('+S+')';
      bx.clearRect(0,0,W,H);bx.strokeStyle=ink;bx.lineWidth=1.5;
      // the circle that holds the bloom, opening out of the door's own circle
      var open=eout(t/0.5);bx.globalAlpha=0.55;bx.beginPath();bx.arc(hx,hy,(b.width/2+(Rb*S-b.width/2)*open),0,7);bx.stroke();
      for(var w=0;w<WAVES;w++){var e=eout((t-0.12-w*0.13)/1.0);if(e<=0)continue;
        // a new flower out of the heart: its circle and six petals grow from nothing, held in that circle
        var R=(R0*0.1+(Rmax-R0*0.1)*e)*S,turn=(w+1)*Math.PI/12;
        bx.globalAlpha=0.7*Math.min(1,e*4);
        bx.beginPath();bx.arc(hx,hy,R,0,7);bx.stroke();
        for(var k=0;k<6;k++){var a=-Math.PI/2+k*Math.PI/3+turn;bx.beginPath();bx.arc(hx+R*Math.cos(a),hy+R*Math.sin(a),R,0,7);bx.stroke();}}
      // once open, the whole figure fades into the paper and the page comes in
      var out=ez((t-1.05)/0.3);svg.style.opacity=String(1-out);cv.style.opacity=String(1-out);
      if(t<1.4)requestAnimationFrame(bloom);})();
    try{sessionStorage.setItem('bloom','in');}catch(_){}
    setTimeout(function(){location.href=x.href;},1420);
  }
  // coming back with the browser's Back button: the figure as it was
  addEventListener('pageshow',function(ev){if(!ev.persisted)return;bloomed=false;
    document.querySelectorAll('body > canvas').forEach(function(n){n.remove();});
    svg.style.transform='';svg.style.opacity='';
    svg.querySelectorAll('[vector-effect]').forEach(function(n){n.removeAttribute('vector-effect');});
    [g.rings,g.lat,g.ent,g.nowmark,g.hint,g.centre,g.seed].concat(g.six).concat(g.doors.map(function(o){return o.g;})).forEach(function(n){if(n)n.style.opacity='';});
    svg.querySelectorAll('text').forEach(function(n){n.style.opacity='';});
    ['.txt','.tip','.top'].forEach(function(q){var n=document.querySelector(q);if(n){n.style.opacity='';n.style.transition='';}});
    [g.seed].concat(g.six).forEach(function(c){c.removeAttribute('transform');c.removeAttribute('vector-effect');});});
  function showTip(ev,e){hoverEntry=e;}
  function showDoor(o){}
  function hideTip(){hoverEntry=null;}
  var toast=document.getElementById('toast'),tt;function say(s){toast.textContent=s;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on');},1800);}
  // A resize rebuilds the figure but keeps the tracing where it was (the viewer resizes the frame on load).
  var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(build,150);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);   // the text block's height, measured once the fonts are in
  document.getElementById('mono').addEventListener('click',function(){mono=!mono;setMono(mono);build();});
  document.getElementById('replay').addEventListener('click',function(){seen=false;t0=null;});
  // "Contact" in the top bar points at the ways to reach me under my name
  document.querySelector('.top a[href="#contact"]').addEventListener('click',function(ev){ev.preventDefault();var r=document.getElementById('contact');
    r.scrollIntoView({behavior:'smooth',block:'center'});if(r.animate)r.animate([{backgroundColor:'rgba(154,123,47,.2)'},{backgroundColor:'rgba(154,123,47,0)'}],{duration:1400});});
  document.getElementById('copy').addEventListener('click',function(){var a=document.getElementById('mail').textContent,b=this;
    function done(){b.textContent='copied';setTimeout(function(){b.textContent='copy';},1600);}
    function pick(){var r=document.createRange();r.selectNodeContents(document.getElementById('mail'));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='selected';}
    try{navigator.clipboard.writeText(a).then(done,pick);}catch(x){pick();}});
  build();requestAnimationFrame(tick);

  var list=document.getElementById('list');
  document.getElementById('list-in').innerHTML='<p style="font:12px var(--mono);color:var(--gold)">NOW · '+NOW+'</p>'+DOORS.map(function(d){return '<h2>'+d.name+'</h2><ul>'+ENTRIES.filter(function(e){return e.p===d.id;}).map(function(e){return '<li>'+e.t+(e.wip?' <span class="w">coming</span>':'')+'</li>';}).join('')+'</ul>';}).join('');
  document.getElementById('simple').addEventListener('click',function(){var on=list.classList.toggle('on');this.textContent=on?'Live view':'Simple view';});
})();
</script></body></html>
